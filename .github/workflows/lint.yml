name: Lint & Format

on: [push, pull_request]

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linters
        run: pip install black isort pylint mypy
      - name: Black format check
        run: black --check --diff qc-security-lab/ qc-attack-lab/ pqc-control-tower/ api/ || true
      - name: isort check
        run: isort --check-only qc-security-lab/ qc-attack-lab/ || true
      - name: mypy type check
        run: mypy qc-security-lab/src/ --ignore-missing-imports || true
