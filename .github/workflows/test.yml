name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          pip install pytest pytest-cov numpy scipy pandas scikit-learn
          pip install -r api/requirements.txt || true

      - name: Install lab dependencies
        run: |
          pip install duckdb pygsti qiskit-experiments || true

      - name: Run security + crypto labs
        run: |
          pytest \
            qc-security-lab/tests/ \
            qc-attack-lab/tests/ \
            pqc-control-tower/tests/ \
            qc-cryptography-module/ \
            qc-classical-security-lab/tests/ \
            qc-pqc-migration-lab/tests/ \
            --cov=. --cov-report=xml --cov-report=term-missing \
            -v --tb=short

      - name: Run new labs
        run: |
          pytest \
            qc-finops-lab/tests/ \
            qc-agent-pqc-lab/tests/ \
            qc-blockchain-pqc-lab/tests/ \
            -v --tb=short

      - name: Run domain labs
        run: |
          pytest \
            qc-banking-lab/tests/ \
            qc-finance-lab/tests/ \
            qc-healthcare-lab/tests/ \
            qc-logistics-lab/tests/ \
            -v --tb=short

      - name: Run API integration + data pipeline + benchmarks
        run: |
          pytest tests/ -v --tb=short

      - name: Crypto KAT (QP-20)
        run: |
          pytest qc-cryptography-module/tests/test_known_answers.py -v --tb=short

      - name: API syntax check (QP-21)
        run: |
          python3 -c "import ast; ast.parse(open('api/main.py').read()); print('api/main.py: syntax OK')"
          python3 -c "import ast; ast.parse(open('api/security_routes.py').read()); print('security_routes.py: syntax OK')"
          python3 -c "import ast; ast.parse(open('api/control_tower_routes.py').read()); print('control_tower_routes.py: syntax OK')"

      - name: Demo script syntax check
        run: |
          for f in qc-banking-lab/src/demo.py qc-finance-lab/src/demo.py \
                   qc-healthcare-lab/src/demo.py qc-logistics-lab/src/demo.py \
                   qc-finops-lab/src/demo.py qc-agent-pqc-lab/src/demo.py \
                   qc-blockchain-pqc-lab/src/demo.py qc-classical-security-lab/src/demo.py \
                   qc-attack-lab/src/demo.py; do
            python3 -c "import ast; ast.parse(open('$f').read()); print('$f: syntax OK')"
          done

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
        continue-on-error: true

  portal-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quantum-portal-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
