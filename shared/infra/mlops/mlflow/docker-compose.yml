# =============================================================================
# MLflow Tracking Server — Standalone Deployment
# Backend: PostgreSQL | Artifact store: GCS (or MinIO for local dev)
# =============================================================================

name: quantum-mlflow

services:

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.2
    container_name: quantum-mlflow-server
    restart: unless-stopped
    command: >
      mlflow server
        --backend-store-uri postgresql://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD}@postgres:5432/${MLFLOW_DB_NAME:-mlflow}
        --default-artifact-root ${MLFLOW_ARTIFACT_ROOT:-s3://quantum-mlflow/artifacts}
        --host 0.0.0.0
        --port 5000
        --workers 4
        --gunicorn-opts "--timeout 300 --log-level info"
    environment:
      # GCS credentials (in prod, use Workload Identity; here for local dev)
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa-key.json
      # S3-compatible (MinIO local dev)
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Auth
      MLFLOW_TRACKING_USERNAME: ${MLFLOW_USER:-admin}
      MLFLOW_TRACKING_PASSWORD: ${MLFLOW_PASSWORD:-changeme}
    ports:
      - "5000:5000"
    volumes:
      - ${GCP_SA_KEY_PATH:-/dev/null}:/secrets/gcp-sa-key.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - mlflow_net

  postgres:
    image: postgres:16-alpine
    container_name: quantum-mlflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MLFLOW_DB_NAME:-mlflow}
      POSTGRES_USER: ${MLFLOW_DB_USER:-mlflow}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:?MLFLOW_DB_PASSWORD required}
    volumes:
      - mlflow_pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # 5433 external avoids conflict with main postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_DB_USER:-mlflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mlflow_net
    command: >
      postgres
        -c max_connections=50
        -c shared_buffers=128MB
        -c log_min_duration_statement=1000

  # MinIO as local GCS/S3 substitute for artifact storage
  minio:
    image: minio/minio:RELEASE.2024-06-04T19-20-08Z
    container_name: quantum-mlflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin_changeme}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - mlflow_net
    profiles:
      - local  # only start minio in local profile: docker compose --profile local up

  minio-init:
    image: minio/mc:RELEASE.2024-06-04T18-23-45Z
    container_name: quantum-mlflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - mlflow_net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_USER:-minioadmin} $${MINIO_PASSWORD:-minioadmin_changeme};
        mc mb --ignore-existing local/quantum-mlflow;
        mc anonymous set none local/quantum-mlflow;
        echo 'MLflow MinIO bucket ready';
      "
    profiles:
      - local

networks:
  mlflow_net:
    driver: bridge

volumes:
  mlflow_pg_data:
  minio_data:
