# =============================================================================
# Quantum Portal — Prometheus Scrape Configuration
# Compatible: Prometheus 2.48+
# Retention: 15d (set via --storage.tsdb.retention.time in CLI flags)
# =============================================================================

global:
  scrape_interval:     15s   # how often to scrape targets
  evaluation_interval: 15s   # how often to evaluate alerting rules
  scrape_timeout:      10s
  external_labels:
    cluster:     "quantum-portal"
    environment: "prod"

# =============================================================================
# Alerting
# =============================================================================
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"
      timeout: 5s
      scheme: http

# =============================================================================
# Rule files (alert rules and recording rules)
# =============================================================================
rule_files:
  - "/etc/prometheus/rules/*.yml"

# =============================================================================
# Scrape configurations
# =============================================================================
scrape_configs:

  # ---------------------------------------------------------------------------
  # Prometheus self-monitoring
  # ---------------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          component: "prometheus"

  # ---------------------------------------------------------------------------
  # FastAPI — quantum-api backend
  # Exposes /metrics via prometheus-fastapi-instrumentator
  # ---------------------------------------------------------------------------
  - job_name: "quantum-api"
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["quantum-api:8000"]
        labels:
          component:   "api"
          language:    "python"
          framework:   "fastapi"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # ---------------------------------------------------------------------------
  # NVIDIA Triton Inference Server
  # Default metrics endpoint: :8002/metrics
  # Exposes: nv_inference_request_success, nv_inference_queue_duration_us,
  #          nv_inference_compute_duration_us, nv_gpu_utilization, etc.
  # ---------------------------------------------------------------------------
  - job_name: "triton"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["triton:8002"]
        labels:
          component: "triton"
          service:   "inference"

  # ---------------------------------------------------------------------------
  # NVIDIA DCGM Exporter — GPU hardware metrics
  # Port: 9400, path: /metrics
  # Exposes: DCGM_FI_DEV_GPU_UTIL, DCGM_FI_DEV_MEM_COPY_UTIL,
  #          DCGM_FI_DEV_POWER_USAGE, DCGM_FI_DEV_SM_CLOCK, etc.
  # ---------------------------------------------------------------------------
  - job_name: "dcgm-exporter"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["dcgm-exporter:9400"]
        labels:
          component: "gpu"
          exporter:  "dcgm"

  # ---------------------------------------------------------------------------
  # Quantum Worker — custom circuit execution metrics
  # Exposed by the worker's built-in /metrics endpoint (port 9101)
  # Custom metrics: quantum_circuit_executions_total, quantum_job_duration_seconds,
  #                 quantum_circuit_fidelity, quantum_job_queue_depth
  # ---------------------------------------------------------------------------
  - job_name: "quantum-worker"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["quantum-worker:9101"]
        labels:
          component: "worker"
          service:   "circuit-execution"

  # ---------------------------------------------------------------------------
  # Kubernetes pod metrics — kube-state-metrics
  # ---------------------------------------------------------------------------
  - job_name: "kube-state-metrics"
    scrape_interval: 30s
    static_configs:
      - targets: ["kube-state-metrics:8080"]
        labels:
          component: "kubernetes"
          exporter:  "kube-state-metrics"

  # ---------------------------------------------------------------------------
  # Kubernetes node metrics — node-exporter
  # ---------------------------------------------------------------------------
  - job_name: "node-exporter"
    scrape_interval: 30s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          component: "node"
          exporter:  "node-exporter"

  # ---------------------------------------------------------------------------
  # Kubernetes pod auto-discovery (cloud deployments)
  # Scrapes pods annotated with prometheus.io/scrape="true"
  # ---------------------------------------------------------------------------
  - job_name: "kubernetes-pods"
    scrape_interval: 30s
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name

  # ---------------------------------------------------------------------------
  # PostgreSQL — postgres_exporter
  # ---------------------------------------------------------------------------
  - job_name: "postgres-exporter"
    scrape_interval: 30s
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          component: "database"
          engine:    "postgresql"

  # ---------------------------------------------------------------------------
  # Redis — redis_exporter
  # ---------------------------------------------------------------------------
  - job_name: "redis-exporter"
    scrape_interval: 30s
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          component: "cache"
          engine:    "redis"

  # ---------------------------------------------------------------------------
  # MLflow — Prometheus metrics (if mlflow-prometheus-exporter is deployed)
  # ---------------------------------------------------------------------------
  - job_name: "mlflow"
    scrape_interval: 60s
    metrics_path: /metrics
    static_configs:
      - targets: ["mlflow:5000"]
        labels:
          component: "mlops"
          service:   "mlflow"

  # ---------------------------------------------------------------------------
  # Ollama — local LLM serving metrics
  # ---------------------------------------------------------------------------
  - job_name: "ollama"
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ["ollama:11434"]
        labels:
          component: "llm"
          service:   "ollama"

