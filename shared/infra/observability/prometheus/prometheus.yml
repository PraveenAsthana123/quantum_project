# =============================================================================
# Quantum Portal — Prometheus Scrape Configuration
# Scrapes: API, Triton, vLLM, DCGM (GPU), Postgres, Redis, kube-state-metrics
# =============================================================================

global:
  scrape_interval: 15s       # default scrape cadence
  evaluation_interval: 15s   # rule evaluation cadence
  scrape_timeout: 10s

  # Labels attached to every time series scraped by this Prometheus
  external_labels:
    cluster: quantum-portal
    env: "${PROMETHEUS_ENV:-dev}"

# ---------------------------------------------------------------------------
# Alertmanager (wire up to PagerDuty / email in prod)
# ---------------------------------------------------------------------------
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

# ---------------------------------------------------------------------------
# Rule files
# ---------------------------------------------------------------------------
rule_files:
  - /etc/prometheus/rules/*.yml

# ---------------------------------------------------------------------------
# Scrape configs
# ---------------------------------------------------------------------------
scrape_configs:

  # ── Quantum FastAPI ──────────────────────────────────────────────────────
  - job_name: quantum-api
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics
    scrape_interval: 15s
    relabel_configs:
      - target_label: service
        replacement: quantum-api

  # ── vLLM inference server ────────────────────────────────────────────────
  - job_name: vllm
    static_configs:
      - targets: ['vllm:8080']
    metrics_path: /metrics
    scrape_interval: 15s
    # Key metrics: vllm:num_requests_running, vllm:time_to_first_token_seconds,
    # vllm:request_prompt_tokens_total, vllm:request_generation_tokens_total
    relabel_configs:
      - target_label: service
        replacement: vllm

  # ── Triton Inference Server ──────────────────────────────────────────────
  - job_name: triton
    static_configs:
      - targets: ['triton:8002']
    metrics_path: /metrics
    scrape_interval: 15s
    # Key metrics: nv_inference_request_success, nv_inference_queue_duration_us,
    # nv_inference_compute_infer_duration_us
    relabel_configs:
      - target_label: service
        replacement: triton

  # ── DCGM Exporter — GPU metrics ──────────────────────────────────────────
  - job_name: dcgm
    static_configs:
      - targets: ['dcgm-exporter:9400']
    scrape_interval: 15s
    # Key metrics: DCGM_FI_DEV_GPU_UTIL, DCGM_FI_DEV_MEM_COPY_UTIL,
    # DCGM_FI_DEV_FB_USED, DCGM_FI_DEV_POWER_USAGE
    relabel_configs:
      - target_label: service
        replacement: dcgm-exporter

  # ── PostgreSQL — postgres_exporter ───────────────────────────────────────
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s
    relabel_configs:
      - target_label: service
        replacement: postgres

  # ── Redis — redis_exporter ───────────────────────────────────────────────
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s
    relabel_configs:
      - target_label: service
        replacement: redis

  # ── Kubernetes state metrics (pod restarts, node health) ─────────────────
  - job_name: kube-state-metrics
    static_configs:
      - targets: ['kube-state-metrics:8080']
    scrape_interval: 30s

  # ── Node Exporter — host CPU/memory/disk ─────────────────────────────────
  - job_name: node-exporter
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.*):10250'
        replacement: '${1}:9100'
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

  # ── MLflow ───────────────────────────────────────────────────────────────
  - job_name: mlflow
    static_configs:
      - targets: ['mlflow:5000']
    metrics_path: /metrics
    scrape_interval: 60s
    relabel_configs:
      - target_label: service
        replacement: mlflow

  # ── Next.js Portal (custom /api/metrics endpoint) ────────────────────────
  - job_name: portal
    static_configs:
      - targets: ['portal:3001']
    metrics_path: /api/metrics
    scrape_interval: 30s
    relabel_configs:
      - target_label: service
        replacement: portal

  # ── Prometheus self-monitoring ───────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 60s
