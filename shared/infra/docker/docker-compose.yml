# =============================================================================
# Quantum Portal — Local Development Docker Compose
# Usage: docker compose up -d
# Prerequisites: Docker >= 24, Compose >= 2.20, NVIDIA Container Toolkit for Triton
# =============================================================================

version: "3.9"

x-restart-policy: &restart-policy
  restart: unless-stopped

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

networks:
  quantum-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  ollama-data:
    driver: local
  triton-model-repo:
    driver: local
  mlflow-data:
    driver: local

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — circuit results + experiment metadata
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    <<: *restart-policy
    container_name: quantum-postgres
    environment:
      POSTGRES_DB: quantum_results
      POSTGRES_USER: quantum_api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      quantum-net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantum_api -d quantum_results"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    shm_size: 256mb
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c wal_level=replica
        -c log_min_duration_statement=1000
        -c shared_preload_libraries=pg_stat_statements

  # ---------------------------------------------------------------------------
  # Redis 7 — job queue + circuit result cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    <<: *restart-policy
    container_name: quantum-redis
    command: >
      redis-server
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --notify-keyspace-events Ex
        --save 900 1
        --save 300 10
        --appendonly yes
        --requirepass ${REDIS_PASSWORD:-dev_redis_changeme}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      quantum-net:
        ipv4_address: 172.20.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis_changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object store (local stand-in for GCS/S3/Azure Blob)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    <<: *restart-policy
    container_name: quantum-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_changeme}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    networks:
      quantum-net:
        ipv4_address: 172.20.0.12
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging

  # MinIO bucket initializer — creates required buckets on first run
  minio-init:
    image: minio/mc:RELEASE.2024-01-18T07-03-39Z
    container_name: quantum-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - quantum-net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin_changeme};
        mc mb --ignore-existing local/quantum-datasets;
        mc mb --ignore-existing local/quantum-mlflow;
        mc mb --ignore-existing local/quantum-circuits;
        echo 'MinIO buckets initialized';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_changeme}

  # ---------------------------------------------------------------------------
  # FastAPI backend — quantum circuit execution + job orchestration
  # ---------------------------------------------------------------------------
  quantum-api:
    image: ${API_IMAGE:-quantum-portal/api:latest}
    build:
      context: ../../
      dockerfile: api/Dockerfile
      target: production
    <<: *restart-policy
    container_name: quantum-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: development
      PORT: "8000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: quantum_results
      DB_USER: quantum_api
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_changeme}
      DB_POOL_SIZE: "20"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_changeme}
      REDIS_DB: "0"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_changeme}
      MINIO_BUCKET_DATASETS: quantum-datasets
      MINIO_BUCKET_CIRCUITS: quantum-circuits
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TRITON_GRPC_URL: triton:8001
      TRITON_HTTP_URL: http://triton:8000
      OLLAMA_BASE_URL: http://ollama:11434
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_changeme}
      LOG_LEVEL: INFO
      CORS_ORIGINS: "http://localhost:3001"
    ports:
      - "8000:8000"
    networks:
      quantum-net:
        ipv4_address: 172.20.0.20
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Quantum Worker — circuit execution worker (Celery / ARQ)
  # ---------------------------------------------------------------------------
  quantum-worker:
    image: ${API_IMAGE:-quantum-portal/api:latest}
    build:
      context: ../../
      dockerfile: api/Dockerfile
      target: production
    <<: *restart-policy
    container_name: quantum-worker
    command: python -m worker.main
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      quantum-api:
        condition: service_healthy
    environment:
      ENV: development
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: quantum_results
      DB_USER: quantum_api
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_changeme}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_changeme}
      REDIS_QUEUE_DB: "0"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_changeme}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      WORKER_CONCURRENCY: "4"
      MAX_CIRCUIT_QUBITS: "29"    # simulator limit for local dev
      DEFAULT_SHOTS: "1024"
      QPU_BACKEND: "aer_simulator" # local Aer — override with real QPU credentials in prod
      LOG_LEVEL: INFO
    networks:
      quantum-net:
        ipv4_address: 172.20.0.21
    healthcheck:
      test: ["CMD", "python", "-c", "from worker.health import check; check()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Next.js Portal — frontend
  # ---------------------------------------------------------------------------
  quantum-portal:
    image: ${PORTAL_IMAGE:-quantum-portal/portal:latest}
    build:
      context: ../../quantum-portal-web
      dockerfile: Dockerfile
      target: runner
    <<: *restart-policy
    container_name: quantum-portal
    depends_on:
      quantum-api:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3001"
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev_nextauth_secret_changeme}
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3001:3001"
    networks:
      quantum-net:
        ipv4_address: 172.20.0.22
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # MLflow — experiment tracking server
  # ---------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.1
    <<: *restart-policy
    container_name: quantum-mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      mlflow server
        --backend-store-uri postgresql://quantum_api:${POSTGRES_PASSWORD:-dev_password_changeme}@postgres:5432/quantum_results
        --artifacts-destination s3://quantum-mlflow/
        --host 0.0.0.0
        --port 5000
        --workers 2
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_changeme}
    ports:
      - "5000:5000"
    networks:
      quantum-net:
        ipv4_address: 172.20.0.23
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - mlflow-data:/mlflow
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Prometheus — metrics collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    <<: *restart-policy
    container_name: quantum-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - prometheus-data:/prometheus
      - ../observability/prometheus_config.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      quantum-net:
        ipv4_address: 172.20.0.30
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Grafana — dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.3.3
    <<: *restart-policy
    container_name: quantum-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-dev_grafana_changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_INSTALL_PLUGINS: "grafana-piechart-panel,grafana-clock-panel"
      GF_DATASOURCES_DEFAULT_URL: http://prometheus:9090
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana_dashboard.json:/var/lib/grafana/dashboards/quantum.json:ro
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      quantum-net:
        ipv4_address: 172.20.0.31
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # NVIDIA Triton Inference Server — quantum ML model serving
  # Requires NVIDIA GPU + nvidia-container-toolkit. Remove deploy section if no GPU.
  # ---------------------------------------------------------------------------
  triton:
    image: nvcr.io/nvidia/tritonserver:24.02-py3
    <<: *restart-policy
    container_name: quantum-triton
    command: >
      tritonserver
        --model-repository=/models
        --http-port=8000
        --grpc-port=8001
        --metrics-port=8002
        --log-verbose=1
        --strict-readiness=false
        --allow-grpc=true
        --allow-http=true
        --allow-metrics=true
    volumes:
      - triton-model-repo:/models
    ports:
      - "8001:8000"   # HTTP REST (remapped: 8001 external → 8000 container)
      - "8002:8001"   # gRPC (remapped)
      - "8003:8002"   # Prometheus metrics (remapped)
    networks:
      quantum-net:
        ipv4_address: 172.20.0.40
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Ollama — local LLM serving (no GPU required; uses CPU)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.1.27
    <<: *restart-policy
    container_name: quantum-ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_MAX_LOADED_MODELS: "2"
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      quantum-net:
        ipv4_address: 172.20.0.41
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    # Uncomment for GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
